<main class="tool-section flex-grow-1">

    <div class="container">

        <div class="text-center mb-5">

            <p class="eyebrow-text fw-bold">

                GITHUB API
            </h1>

            <p class="section-subtitle">
                Search GitHub users and view their public profile.
            </p>

        </div>


        <div class="card tool-card mx-auto"
             style="max-width: 700px;">

            <div class="card-body">

                <div class="input-group">

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter GitHub username"
                    >

                    <button
                        class="btn btn-jasynova"
                        onclick="getUser()"
                    >
                        SEARCH
                    </button>

                </div>


                <div
                    id="userResult"
                    class="result-box text-center"
                >
                    Search for a GitHub user.
                </div>

            </div>

        </div>

    </div>

<script>

function getUser() {

    let username =
        document.getElementById("username").value;


    if (username === "") {

        document.getElementById("userResult").innerText =
            "Please enter a GitHub username.";

        return;

    }


    let url =
        `https://api.github.com/users/${username}`;


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "User not found"
                );

            }

            return response.json();

        })

        .then(data => {

            document
                .getElementById("userResult")
                .innerHTML = `

                <img
                    src="${data.avatar_url}"
                    class="github-avatar"
                    alt="GitHub Avatar"
                >

                <h3>${data.name || data.login}</h3>

                <p>
                    Username: ${data.login}
                </p>

                <p>
                    Public Repositories:
                    ${data.public_repos}
                </p>

                <p>
                    Followers:
                    ${data.followers}
                </p>
            `;

        })

        .catch(error => {

            document
                .getElementById("userResult")
                .innerText =
                "GitHub user not found.";

        });

}

</script>
