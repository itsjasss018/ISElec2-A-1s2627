            <div class="card-body">

                    <input
                        type="text"
                        id="locationInput"
                        class="form-control"
                        placeholder="Enter a location"
                    >

                    <button
                        class="btn btn-jasynova"
                        onclick="searchLocation()"
                    >

<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

let map =
    L.map("map").setView(
        [13.1391, 123.7438],
        10
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


let marker;


function searchLocation() {

    let location =
        document.getElementById("locationInput").value;


    if (location === "") {

        alert("Please enter a location!");

        return;

    }


    fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q="
        + encodeURIComponent(location)
    )

        .then(response => response.json())

        .then(data => {

            if (data.length > 0) {

                let latitude =
                    data[0].lat;

                let longitude =
                    data[0].lon;


                map.setView(
                    [latitude, longitude],
                    13
                );


                if (marker) {

                    map.removeLayer(marker);

                }


                marker =
                    L.marker(
                        [latitude, longitude]
                    )

                    .addTo(map)

                    .bindPopup(
                        data[0].display_name
                    )

                    .openPopup();

            }

            else {

                alert("Location not found!");

            }

        })

        .catch(error => {

            console.error(error);

            alert("Error searching for location!");

        });

}

</script>
