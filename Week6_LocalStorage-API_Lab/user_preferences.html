<main class="tool-section flex-grow-1">

    <div class="container">

        <div class="text-center mb-5">

            <p class="eyebrow-text fw-bold">
                FEATURE 02
            </p>

            <h1 class="section-title">
                USER PREFERENCES
            </h1>

            <p class="section-subtitle">
                Save your preferred settings using Local Storage.
            </p>

        </div>


        <div class="card tool-card mx-auto"
             style="max-width: 700px;">

            <div class="card-body">

                <h3 class="mb-4">
                    Customize Preferences
                </h3>


                <div class="mb-3">

                    <label
                        for="theme"
                        class="form-label"
                    >
                        Select Theme
                    </label>

                    <select
                        id="theme"
                        class="form-select"
                    >
                        <option value="light">
                            Light
                        </option>

                        <option value="dark">
                            Dark
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label
                        for="language"
                        class="form-label"
                    >
                        Select Language
                    </label>

                    <select
                        id="language"
                        class="form-select"
                    >
                        <option value="English">
                            English
                        </option>

                        <option value="Filipino">
                            Filipino
                        </option>

                    </select>

                </div>


                <button
                    class="btn btn-jasynova"
                    onclick="savePreferences()"
                >
                    SAVE PREFERENCES
                </button>


                <button
                    class="btn btn-purple"
                    onclick="loadPreferences()"
                >
                    LOAD PREFERENCES
                </button>


                <div
                    id="result"
                    class="result-box"
                >
                    Your preferences will appear here.
                </div>

            </div>

        </div>

<script>

function savePreferences() {

    let theme =
        document.getElementById("theme").value;

    let language =
        document.getElementById("language").value;


    localStorage.setItem("theme", theme);
    localStorage.setItem("language", language);


    applyTheme(theme);


    document.getElementById("result").innerText =
        "Preferences saved successfully!";

}


function loadPreferences() {

    let theme =
        localStorage.getItem("theme");

    let language =
        localStorage.getItem("language");


    if (theme && language) {

        document.getElementById("theme").value = theme;

        document.getElementById("language").value = language;


        applyTheme(theme);


        document.getElementById("result").innerText =
            "Theme: " + theme +
            " | Language: " + language;

    } else {

        document.getElementById("result").innerText =
            "No saved preferences found.";

    }

}


/* APPLY THEME */

function applyTheme(theme) {

    if (theme === "dark") {

        document.body.classList.add("dark-mode");

    } else {

        document.body.classList.remove("dark-mode");

    }

}


/* LOAD SAVED THEME AUTOMATICALLY */

window.addEventListener("DOMContentLoaded", function () {

    let savedTheme =
        localStorage.getItem("theme");

    if (savedTheme) {

        document.getElementById("theme").value =
            savedTheme;

        applyTheme(savedTheme);

    }

});

</script>
