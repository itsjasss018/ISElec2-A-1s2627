<!-- MAIN -->

<main class="tool-section flex-grow-1">

    <div class="container">

        <div class="text-center mb-5">

            <p class="eyebrow-text fw-bold">
                FEATURE 01
            </p>

            <h1 class="section-title">
                LOCAL STORAGE
            </h1>

            <p class="section-subtitle">
                Save and retrieve information directly
                from your browser.
            </p>

        </div>


        <div class="card tool-card mx-auto"
             style="max-width: 700px;">

            <div class="card-body">

                <h3 class="mb-4">
                    Save User Information
                </h3>


                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Enter Your Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="d-flex gap-2">

                    <button
                        class="btn btn-jasynova"
                        onclick="saveData()"
                    >
                        SAVE
                    </button>


                    <button
                        class="btn btn-purple"
                        onclick="loadData()"
                    >
                        LOAD
                    </button>

                </div>


                <div
                    id="display"
                    class="result-box"
                >
                    Your saved information will appear here.
                </div>

            </div>

        </div>

    </div>

</main>

<script>

function saveData() {

    let name =
        document.getElementById("username").value;

    if (name === "") {

        document.getElementById("display").innerText =
            "Please enter your name first.";

        return;
    }


    localStorage.setItem("userName", name);


    document.getElementById("display").innerText =
        "Your name has been saved successfully!";

}


function loadData() {

    let name =
        localStorage.getItem("userName");


    if (name) {

        document.getElementById("display").innerText =
            "Welcome, " + name + "!";

    } else {

        document.getElementById("display").innerText =
            "No saved information found.";

    }

}

</script>
