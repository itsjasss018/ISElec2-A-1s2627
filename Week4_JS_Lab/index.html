<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 CSS Lab</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>MY CSS WEB PAGE</h1>
        <h1 id="heading">Welcome to My Webpage</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <div class = "task-container">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addTask">Add Task</button>
        <button id="themeToggle">Switch Theme</button>
    </div>

    <ul id="taskList"></ul>
    
 
    <div id="modal" class="modal">
     <div class="modal-content">
        <p id="modalMessage"></p>
        <button id="closeModal">Close</button>
     </div>
    </div>

    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Welcome to our website! This section introduces our company and its values.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>We offer a range of services designed to meet your needs.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>

        <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
    
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>

    </main>
    <footer>
        <p>&copy; 2026 J.R.R </p>
    </footer>
</body>

</html>
